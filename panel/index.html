<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>会话任务</title>
</head>
<body>
  <main>
    <h1>会话任务</h1>
    <header>
      <span id="activity" class="muted"></span>
      <p id="session" class="session muted"></p>
      <span id="companion-state" role="status" class="muted">正在检查上报组件…</span>
      <button id="refresh" title="刷新任务和安装状态" aria-label="刷新任务和安装状态"><i data-lucide="refresh-cw"></i></button>
    </header>
    <section id="setup" aria-label="上报组件">
      <button id="install" class="install" type="button" hidden><span id="install-label">安装上报组件</span></button>
      <div id="install-confirm" hidden>
        <p>确认写入以下 OpenCode 插件目录？</p>
        <code id="install-path"></code>
        <p class="muted">仅安装此扩展的上报组件，不修改其他插件或配置。</p>
        <div class="confirm-actions"><button id="confirm-install" type="button">确认安装</button><button id="cancel-install" type="button">取消</button></div>
      </div>
    </section>
    <section id="summary" hidden>
      <div class="totals"><strong id="title"></strong><span id="count"></span></div>
      <div id="progress" role="progressbar" aria-label="任务完成度" aria-valuemin="0" aria-valuemax="100"><div id="bar"></div></div>
      <div id="filters" role="group" aria-label="任务筛选"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="open" aria-pressed="false">未完成</button><button data-filter="completed" aria-pressed="false">已完成</button></div>
    </section>
    <p id="message" role="status">正在连接会话…</p>
    <ul id="tasks" aria-label="会话任务清单"></ul>
    <footer><span id="updated" class="muted"></span><span id="source" class="muted"></span></footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
